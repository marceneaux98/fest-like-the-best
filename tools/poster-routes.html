<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route editor (festival map)</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #2b2b33; color: #111; display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  #panel { background: #fff; padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  #panel h1 { font-size: 17px; margin: 0; color: #542e91; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 6px 10px 8px; margin: 0; }
  legend { font-weight: 700; font-size: 13px; padding: 0 4px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 5px 0; }
  button, select { font: inherit; padding: 5px 9px; border-radius: 6px; border: 1px solid #bbb; background: #f6f6f8; cursor: pointer; }
  select { width: 100%; }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: #f26631; color: #fff; border-color: #f26631; }
  button.primary { background: #542e91; color: #fff; border-color: #542e91; font-weight: 600; }
  #hint { background: #fff7d6; border: 1px solid #f0d36b; border-radius: 6px; padding: 7px 9px; font-size: 13px; line-height: 1.35; }
  #routeInfo, #stageInfo, #status { font-size: 12px; color: #444; white-space: pre-wrap; line-height: 1.4; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: #eee; }
  .tag.manual { background: #ffe9a8; } .tag.auto { background: #e6ddff; }
  #wrap { overflow: auto; position: relative; }
  #stage { position: relative; width: 100%; }
  #stage > svg.map { width: 100%; height: auto; display: block; }
  #stage.dim #layer-features, #stage.dim #layer-labels { opacity: .3; }
  #over { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; } #stage { min-width: 640px; } }
</style>
</head>
<body>
<div id="panel">
  <h1>Route editor</h1>
  <div id="hint">Loading the map…</div>

  <fieldset>
    <legend>1 · Stage pins and entrances</legend>
    <select id="stageSel" aria-label="Stage"></select>
    <div class="row">
      <button id="setPin" type="button">Place pin</button>
      <button id="setEnt" type="button">Add entrance</button>
    </div>
    <div class="row">
      <button id="popEnt" type="button">Remove last entrance</button>
      <button id="autoEnt" type="button">Clear entrances</button>
    </div>
    <div id="stageInfo"></div>
  </fieldset>

  <fieldset>
    <legend>2 · Routes</legend>
    <select id="routeSel" aria-label="Route"></select>
    <div class="row">
      <button id="draw" type="button">Draw this route</button>
      <button id="undo" type="button" disabled>Undo point</button>
    </div>
    <div class="row">
      <button id="finish" type="button" disabled>Finish</button>
      <button id="cancel" type="button" disabled>Cancel</button>
    </div>
    <div class="row"><label><input type="checkbox" id="follow" checked> Follow the streets between clicks</label></div>
    <div class="row"><button id="revert" type="button">Use the automatic route</button></div>
    <div id="routeInfo"></div>
  </fieldset>

  <fieldset>
    <legend>View</legend>
    <div class="row"><label>Zoom <select id="zoom" style="width:auto"><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label></div>
    <div class="row"><label><input type="checkbox" id="dim" checked> Dim icons and labels</label></div>
    <div class="row"><label><input type="checkbox" id="showAll" checked> Show all routes</label></div>
  </fieldset>

  <div class="row"><button id="save" class="primary" type="button" disabled>Save</button></div>
  <div id="status"></div>
</div>
<div id="wrap"><div id="stage" class="dim"></div></div>

<script src="../routes.js"></script>
<script src="../overlay.js"></script>
<script>
// Route editor for the festival map. Serve the site with `python serve.py` and open tools/poster-routes.html.
//
// How routes are made
//   Automatic: the light-cyan streets drawn on assets/sitemap.svg are thinned to centre lines; every
//   stage-to-stage route is the shortest path along them between the two stages' entrances.
//   By hand: pick a route, click "Draw this route", click points along the way, then Finish. With
//   "Follow the streets" on, the line runs along the drawn streets between your clicks; off, it goes
//   straight (for shortcuts through a lot or a plaza). Each click remembers which it was.
//
// Pins and entrances
//   The pin is where the stage's label sits on the map. An entrance is where people walk into the
//   stage from a street; a stage can have several (Internationale, FrancoSphere). Every route uses
//   whichever pair of entrances gives the shortest walk, and the app adds a dotted hop from the pin
//   to that entrance. With no entrance placed, the nearest street to the pin is used.
//
// Save writes assets/poster-routes.json (pins, entrances, every route, and the clicks of hand-drawn
// routes so they can be edited again). Hand-drawn routes are kept when anything else changes.
var OC = window.OVERLAY_CONFIG, W = OC.width, H = OC.height, S = 2;
var SIDE_STREETS = ['#1c68b8', '#1c67b7', '#1d69b9'];
var SIMPLIFY = 1.0, METRES_PER_PT = 0.63;
var NS = 'http://www.w3.org/2000/svg';
var LOC = window.ROUTE_DATA.locations, ids = LOC.map(function (l) { return l.id; });
var nameOf = {}, colorOf = {}; LOC.forEach(function (l) { nameOf[l.id] = l.name; colorOf[l.id] = l.color || '#542e91'; });
var keys = []; ids.forEach(function (a, i) { ids.slice(i + 1).forEach(function (b) { keys.push(a + '|' + b); }); });
function realMetres(k) { var ab = k.split('|'), r = ROUTE_DATA.routes[k] || ROUTE_DATA.routes[ab[1] + '|' + ab[0]]; return r ? r.meters : null; }

var $ = function (id) { return document.getElementById(id); };
var hintEl = $('hint'), statusEl = $('status');
function hint(t) { hintEl.textContent = t; }

// ---------- state ----------
var pins = {}, entHint = {}, manual = {};      // entHint: id -> [[x,y]...] placed by hand; manual: key -> { wps: [{p:[x,y], follow}], endFollow }
var entIdx = {}, entrances = {}, auto = {}, routes = {};   // entIdx/entrances: id -> list (snapped to the streets)
function asList(e) { return !e ? null : typeof e[0] === 'number' ? [e] : e; }   // older files kept one entrance per stage
var mode = null, drawing = null, dirty = false;
var cw = Math.round(W * S), ch = Math.round(H * S), N = cw * ch, img = null, skel = null, over = null;

function setDirty(d) { dirty = d; $('save').disabled = !d; }
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// ---------- load ----------
Promise.all([
  fetch('../' + OC.svg, { cache: 'no-cache' }).then(function (r) { return r.text(); }),
  fetch('../' + OC.routes, { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
]).then(function (res) {
  var stage = $('stage');
  stage.innerHTML = res[0];
  var svg = stage.querySelector('svg'); svg.classList.add('map');
  ['legend', 'logo'].forEach(function (n) { var g = svg.querySelector('#layer-' + n); if (g) g.style.display = 'none'; });
  over = document.createElementNS(NS, 'svg');
  over.id = 'over'; over.setAttribute('viewBox', '0 0 ' + W + ' ' + H); over.setAttribute('preserveAspectRatio', 'none');
  stage.appendChild(over);

  var saved = res[1] || {};
  ids.forEach(function (id) {
    var f = OC.stages[id] || [0.5, 0.5];
    pins[id] = (saved.pins && saved.pins[id]) || [f[0] * W, f[1] * H];
  });
  (saved.entranceSet || []).forEach(function (id) { var e = asList(saved.entrances && saved.entrances[id]); if (e) entHint[id] = e; });
  manual = saved.manual || {};

  buildSkeleton(svg);
  ids.forEach(function (id) { $('stageSel').add(new Option(nameOf[id], id)); });
  keys.forEach(function (k) { $('routeSel').add(new Option('', k)); });
  retrace();
  hint('Pick a route and click "Draw this route", or pick a stage to move its pin or entrance. Clicking a pin on the map selects that stage.');
  window.EDITOR_READY = true;
}).catch(function (err) { hint('Failed: ' + (err && err.message || err)); });

// ---------- street centre lines ----------
function buildSkeleton(svg) {
  var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  var ctx = cv.getContext('2d'); ctx.scale(S, S); ctx.fillStyle = '#000';
  svg.querySelectorAll('#layer-streets path').forEach(function (p) {
    if (SIDE_STREETS.indexOf((p.getAttribute('fill') || '').toLowerCase()) >= 0) return;
    ctx.fill(new Path2D(p.getAttribute('d')), p.getAttribute('fill-rule') === 'evenodd' ? 'evenodd' : 'nonzero');
  });
  var px = ctx.getImageData(0, 0, cw, ch).data, list = [];
  img = new Uint8Array(N);
  for (var i = 0; i < N; i++) if (px[i * 4 + 3] > 127) { img[i] = 1; list.push(i); }
  // Zhang-Suen thinning
  var changed = true, del = [];
  while (changed) {
    changed = false;
    for (var pass = 0; pass < 2; pass++) {
      del.length = 0;
      for (var k = 0; k < list.length; k++) {
        var p = list[k]; if (!img[p]) continue;
        var x = p % cw, y = (p - x) / cw;
        if (x < 1 || y < 1 || x >= cw - 1 || y >= ch - 1) { del.push(p); continue; }
        var p2 = img[p - cw], p3 = img[p - cw + 1], p4 = img[p + 1], p5 = img[p + cw + 1], p6 = img[p + cw], p7 = img[p + cw - 1], p8 = img[p - 1], p9 = img[p - cw - 1];
        var B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
        if (B < 2 || B > 6) continue;
        var A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2);
        if (A !== 1) continue;
        if (pass === 0 ? (p2 * p4 * p6 === 0 && p4 * p6 * p8 === 0) : (p2 * p4 * p8 === 0 && p2 * p6 * p8 === 0)) del.push(p);
      }
      if (del.length) { changed = true; for (var d = 0; d < del.length; d++) img[del[d]] = 0; }
    }
    list = list.filter(function (p) { return img[p]; });
  }
  skel = list;
}
function idxToPt(p) { var x = p % cw; return [Math.round(x / S * 10) / 10, Math.round((p - x) / cw / S * 10) / 10]; }
function nearestSkel(pt) {
  var x = pt[0] * S, y = pt[1] * S, best = -1, bd = Infinity;
  for (var k = 0; k < skel.length; k++) {
    var p = skel[k], sx = p % cw, sy = (p - sx) / cw, dd = (sx - x) * (sx - x) + (sy - y) * (sy - y);
    if (dd < bd) { bd = dd; best = p; }
  }
  return best;
}
function dijkstra(src) {
  var dist = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1), heap = [[0, src]];
  dist[src] = 0;
  function push(e) { heap.push(e); var i = heap.length - 1; while (i > 0) { var pi = (i - 1) >> 1; if (heap[pi][0] <= heap[i][0]) break; var t = heap[pi]; heap[pi] = heap[i]; heap[i] = t; i = pi; } }
  function pop() { var top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; var i = 0; for (;;) { var l = 2 * i + 1, r = l + 1, m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; var t = heap[m]; heap[m] = heap[i]; heap[i] = t; i = m; } } return top; }
  var nb = [-cw - 1, -cw, -cw + 1, -1, 1, cw - 1, cw, cw + 1], cost = [1.4142, 1, 1.4142, 1, 1, 1.4142, 1, 1.4142];
  while (heap.length) {
    var e = pop(), d0 = e[0], u = e[1];
    if (d0 > dist[u]) continue;
    for (var k = 0; k < 8; k++) { var v = u + nb[k]; if (v < 0 || v >= N || !img[v]) continue; var nd = d0 + cost[k]; if (nd < dist[v]) { dist[v] = nd; prev[v] = u; push([nd, v]); } }
  }
  prev.dist = dist;
  return prev;
}
function chainTo(prev, src, dst) {
  var cur = dst, chain = [];
  while (cur !== -1) { chain.push(cur); if (cur === src) break; cur = prev[cur]; }
  if (cur !== src) return null;
  return chain.reverse().map(idxToPt);
}
function simplify(pts, tol) {
  if (pts.length < 3) return pts;
  var keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  var stack = [[0, pts.length - 1]];
  while (stack.length) {
    var s = stack.pop(), a = pts[s[0]], b = pts[s[1]], md = 0, mi = -1;
    var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1e-9;
    for (var i = s[0] + 1; i < s[1]; i++) { var d = Math.abs(dy * pts[i][0] - dx * pts[i][1] + b[0] * a[1] - b[1] * a[0]) / len; if (d > md) { md = d; mi = i; } }
    if (md > tol) { keep[mi] = 1; stack.push([s[0], mi], [mi, s[1]]); }
  }
  return pts.filter(function (_, i) { return keep[i]; });
}
function along(fromPt, toPt) {          // street path between two points (each snapped to the nearest centre line)
  var a = nearestSkel(fromPt), b = nearestSkel(toPt);
  var path = chainTo(dijkstra(a), a, b);
  return path ? simplify(path, SIMPLIFY) : [fromPt, toPt];
}
function plen(pts) { var L = 0; for (var i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }

// ---------- routes ----------
function retrace() {
  ids.forEach(function (id) {
    var list = (entHint[id] || [pins[id]]).map(nearestSkel);
    entIdx[id] = list.filter(function (v, i) { return list.indexOf(v) === i; });
    entrances[id] = entIdx[id].map(idxToPt);
  });
  var trees = {};                                      // entrance pixel -> shortest-path tree from it
  ids.forEach(function (id) { entIdx[id].forEach(function (e) { if (!trees[e]) trees[e] = dijkstra(e); }); });
  auto = {};
  ids.forEach(function (a, ai) {
    ids.slice(ai + 1).forEach(function (b) {
      var best = null;                                 // the pair of entrances with the shortest walk
      entIdx[a].forEach(function (ea) { entIdx[b].forEach(function (eb) {
        var d = trees[ea].dist[eb];
        if (!best || d < best.d) best = { d: d, ea: ea, eb: eb };
      }); });
      var p = best && isFinite(best.d) ? chainTo(trees[best.ea], best.ea, best.eb) : null;
      auto[a + '|' + b] = p ? simplify(p, SIMPLIFY) : [entrances[a][0], entrances[b][0]];
    });
  });
  routes = {};
  keys.forEach(function (k) { routes[k] = manual[k] ? buildManual(k, manual[k].wps, manual[k].endFollow) : auto[k]; });
  refreshLabels(); render();
}
function nearestOf(list, pt) {
  return list.reduce(function (best, e) { return Math.hypot(e[0] - pt[0], e[1] - pt[1]) < Math.hypot(best[0] - pt[0], best[1] - pt[1]) ? e : best; });
}
function buildManual(k, wps, endFollow) {
  // Starts at the stage's entrance nearest the first click, ends at the other stage's entrance nearest the last.
  var ab = k.split('|');
  var start = nearestOf(entrances[ab[0]], wps.length ? wps[0].p : entrances[ab[1]][0]);
  var end = nearestOf(entrances[ab[1]], wps.length ? wps[wps.length - 1].p : start);
  var out = [start], cur = start;
  wps.concat([{ p: end, follow: endFollow }]).forEach(function (w) {
    var seg = w.follow ? along(cur, w.p) : [cur, w.p];
    out = out.concat(seg.slice(1));
    cur = w.follow ? seg[seg.length - 1] : w.p;
  });
  return out.map(function (p) { return [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]; });
}
function refreshStageInfo() {
  var id = $('stageSel').value; if (!id || !entrances[id]) return;
  $('stageInfo').textContent = nameOf[id] + ': ' + (entHint[id] ? entrances[id].length + ' entrance' + (entrances[id].length > 1 ? 's' : '') + ' placed by hand' : 'entrance = nearest street to the pin');
}
function refreshLabels() {
  refreshStageInfo();
  Array.prototype.forEach.call($('routeSel').options, function (o) {
    var ab = o.value.split('|');
    o.textContent = (manual[o.value] ? '✎ ' : '') + nameOf[ab[0]] + ' → ' + nameOf[ab[1]];
  });
  var k = $('routeSel').value, r = routes[k] || [], real = realMetres(k);
  $('routeInfo').innerHTML = (manual[k] ? '<span class="tag manual">drawn by hand</span>' : '<span class="tag auto">automatic</span>') +
    '\nOn the map ≈ ' + Math.round(plen(r) * METRES_PER_PT * 3.28084) + ' ft · real street distance ' + (real ? Math.round(real * 3.28084) + ' ft' : '?') +
    '\n(The map is not to scale; walking times use the real distance.)';
}

// ---------- drawing ----------
function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var a in attrs) e.setAttribute(a, attrs[a]); (parent || over).appendChild(e); return e; }
function pts2(p) { return p.map(function (q) { return q.join(','); }).join(' '); }
function render() {
  over.innerHTML = '';
  var sel = $('routeSel').value, st = $('stageSel').value;
  if ($('showAll').checked) keys.forEach(function (k) {
    if (k === sel) return;
    el('polyline', { points: pts2(routes[k]), fill: 'none', stroke: manual[k] ? '#ffd23f' : '#cbb8ff', 'stroke-width': 1.6, 'stroke-linejoin': 'round', opacity: .8 });
  });
  var cur = drawing ? currentDrawPath() : routes[sel];
  if (cur) {
    el('polyline', { points: pts2(cur), fill: 'none', stroke: '#fff', 'stroke-width': 7, 'stroke-linejoin': 'round' });
    el('polyline', { points: pts2(cur), fill: 'none', stroke: drawing ? '#f26631' : '#542e91', 'stroke-width': 4, 'stroke-linejoin': 'round' });
  }
  if (drawing) drawing.wps.forEach(function (w) { el('circle', { cx: w.p[0], cy: w.p[1], r: 3.5, fill: w.follow ? '#f26631' : '#fff', stroke: '#f26631', 'stroke-width': 1.5 }); });
  var ab = sel.split('|');
  ids.forEach(function (id) {
    var on = id === st, inRoute = ab.indexOf(id) >= 0;
    entrances[id].forEach(function (e) {
      el('line', { x1: pins[id][0], y1: pins[id][1], x2: e[0], y2: e[1], stroke: '#fff', 'stroke-width': inRoute || on ? 1.8 : 1, 'stroke-dasharray': '2 3' });
      el('rect', { x: e[0] - 3, y: e[1] - 3, width: 6, height: 6, fill: entHint[id] ? '#ffd23f' : '#fff', stroke: '#162061', 'stroke-width': 1 });
    });
    if (on) el('circle', { cx: pins[id][0], cy: pins[id][1], r: 11, fill: 'none', stroke: '#ffd23f', 'stroke-width': 2.5 });
    el('circle', { cx: pins[id][0], cy: pins[id][1], r: 6.5, fill: colorOf[id], stroke: '#fff', 'stroke-width': 2 });
    var t = el('text', { x: pins[id][0] + 9, y: pins[id][1] + 4, fill: '#fff', 'font-size': 11, 'font-weight': 700, stroke: '#162061', 'stroke-width': 3, 'paint-order': 'stroke' });
    t.textContent = nameOf[id];
  });
}
function currentDrawPath() {
  var k = drawing.key, ab = k.split('|');
  var p = buildManual(k, drawing.wps, $('follow').checked);
  return drawing.wps.length ? p : [entrances[ab[0]][0]].concat(p.slice(-1));
}

// ---------- modes ----------
function setMode(m) {
  mode = m;
  $('setPin').classList.toggle('on', m === 'pin');
  $('setEnt').classList.toggle('on', m === 'ent');
  $('draw').classList.toggle('on', m === 'draw');
  ['undo', 'finish', 'cancel'].forEach(function (b) { $(b).disabled = m !== 'draw'; });
  $('draw').disabled = m === 'draw';
  var st = nameOf[$('stageSel').value];
  hint(m === 'pin' ? 'Click on the map where the ' + st + ' pin should sit (on the stage drawing).' :
       m === 'ent' ? 'Click on a street where people walk into ' + st + '. Add as many as the stage has; each route uses the closest one.' :
       m === 'draw' ? 'Click points along the way from ' + $('routeSel').selectedOptions[0].textContent.replace('✎ ', '') +
         '. You only need a click at each turn. Untick "Follow the streets" before a click to go straight there (a shortcut). Then Finish.' :
       'Pick a route and click "Draw this route", or pick a stage to move its pin or entrance. Clicking a pin on the map selects that stage.');
}
function evtPt(e) {
  var p = over.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  var q = p.matrixTransform(over.getScreenCTM().inverse());
  return [Math.round(q.x * 10) / 10, Math.round(q.y * 10) / 10];
}
document.addEventListener('click', function (e) {
  if (!over || !over.contains(e.target)) return;
  var pt = evtPt(e), id = $('stageSel').value;
  if (mode === 'pin') { pins[id] = pt; setMode(null); setDirty(true); retrace(); return; }
  if (mode === 'ent') { (entHint[id] = entHint[id] || []).push(pt); setMode(null); setDirty(true); retrace(); return; }
  if (mode === 'draw') { drawing.wps.push({ p: pt, follow: $('follow').checked }); render(); return; }
  // no mode: clicking near a pin selects that stage
  var near = ids.filter(function (i) { return Math.hypot(pins[i][0] - pt[0], pins[i][1] - pt[1]) < 12; })[0];
  if (near) { $('stageSel').value = near; render(); }
});
$('setPin').onclick = function () { setMode(mode === 'pin' ? null : 'pin'); };
$('setEnt').onclick = function () { setMode(mode === 'ent' ? null : 'ent'); };
$('autoEnt').onclick = function () { delete entHint[$('stageSel').value]; setDirty(true); retrace(); };
$('popEnt').onclick = function () {
  var id = $('stageSel').value; if (!entHint[id]) return;
  entHint[id].pop(); if (!entHint[id].length) delete entHint[id];
  setDirty(true); retrace();
};
$('stageSel').onchange = function () { refreshStageInfo(); render(); setMode(mode === 'draw' ? 'draw' : null); };
$('routeSel').onchange = function () { if (drawing) { drawing = null; setMode(null); } refreshLabels(); render(); };
$('draw').onclick = function () { drawing = { key: $('routeSel').value, wps: [] }; setMode('draw'); render(); };
$('undo').onclick = function () { if (drawing) { drawing.wps.pop(); render(); } };
$('cancel').onclick = function () { drawing = null; setMode(null); render(); };
$('finish').onclick = function () {
  if (!drawing) return;
  manual[drawing.key] = { wps: drawing.wps, endFollow: $('follow').checked };
  drawing = null; setMode(null); setDirty(true); retrace();
};
$('revert').onclick = function () { delete manual[$('routeSel').value]; setDirty(true); retrace(); };
$('follow').onchange = function () { if (drawing) render(); };
$('showAll').onchange = render;
$('dim').onchange = function () { $('stage').classList.toggle('dim', $('dim').checked); };
$('zoom').onchange = function () { $('stage').style.width = (parseFloat($('zoom').value) * 100) + '%'; };
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { drawing = null; setMode(null); render(); }
  if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) && drawing) { e.preventDefault(); $('undo').onclick(); }
});

// ---------- save ----------
function save() {
  var out = {
    built: new Date().toISOString().slice(0, 16).replace('T', ' '), width: W, height: H,
    note: 'Made with tools/poster-routes.html. Points are poster points [x, y] on the ' + W + ' x ' + H + ' page. ' +
          'entrances: id -> list of street points (a stage can have several). Each route runs between the entrances ' +
          'it uses; the app draws a dotted hop from each pin to the route ends.',
    pins: pins, entrances: entrances, entranceSet: Object.keys(entHint), routes: routes, manual: manual
  };
  statusEl.textContent = 'Saving…';
  return fetch('/__save/poster-routes.json', { method: 'POST', headers: { 'X-FLTB-Save': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(out) })
    .then(function (r) { return r.text().then(function (t) {
      statusEl.textContent = r.ok ? 'Saved ' + new Date().toLocaleTimeString() + '. Tell Claude to publish it.' : 'Error: ' + t;
      if (r.ok) setDirty(false);
      window.SAVED = r.ok;
    }); })
    .catch(function (err) { statusEl.textContent = 'Could not save (is python serve.py running?): ' + err.message; });
}
$('save').onclick = save;
</script>
</body>
</html>
