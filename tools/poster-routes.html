<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poster routes (dev tool)</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; background: #555; color: #111; }
  header { position: sticky; top: 0; z-index: 2; padding: 8px 12px; background: #fff; border-bottom: 1px solid #ccc; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  #log { white-space: pre-wrap; font: 12px ui-monospace, monospace; padding: 6px 12px; background: #fff; max-height: 160px; overflow: auto; }
  #stage { position: relative; margin: 12px; }
  #stage > svg { width: 100%; height: auto; display: block; }
  #over { position: absolute; inset: 0; width: 100%; height: 100%; }
  button, select { font: inherit; padding: 4px 10px; }
</style>
</head>
<body>
<header>
  <strong>Poster routes</strong>
  <span id="status">Working…</span>
  <label>Show <select id="pair"><option value="">all routes</option></select></label>
  <label><input type="checkbox" id="skel"> street centre lines</label>
  <button id="save" type="button" disabled>Save to assets/poster-routes.json</button>
</header>
<div id="log"></div>
<div id="stage"></div>
<script src="../routes.js"></script>
<script src="../overlay.js"></script>
<script>
// Dev tool: traces walking routes between stages along the streets DRAWN on the festival map.
//
//  1. Paints the main-street shapes of assets/sitemap.svg (#layer-streets, the light-cyan ribbons)
//     onto a canvas, then thins them to one-pixel centre lines (Zhang-Suen thinning).
//  2. Finds each stage's street entrance: its "entrances" point in overlay.js if set, else the pin,
//     snapped to the nearest centre line.
//  3. Finds the shortest path along the centre lines between every pair of entrances (Dijkstra) and
//     simplifies it. The app draws that solid and the short hop from entrance to pin dotted.
//  4. Shows the result over the map; Save writes assets/poster-routes.json (via serve.py).
//
// Usage: tools/poster-routes.html[?save=1]  (serve with python serve.py)
var q = new URLSearchParams(location.search);
var OC = window.OVERLAY_CONFIG, W = OC.width, H = OC.height;
var S = 2;                            // canvas pixels per poster point
var SIDE_STREETS = ['#1c68b8', '#1c67b7', '#1d69b9'];   // thin dark streets outside the festival: not walked
var SIMPLIFY = 1.0;                   // points; Douglas-Peucker tolerance
var logEl = document.getElementById('log'), statusEl = document.getElementById('status');
function log(s) { logEl.textContent += s + '\n'; }

var ids = window.ROUTE_DATA.locations.map(function (l) { return l.id; });
var result = null, skeletonPts = null;

fetch('../' + OC.svg, { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (text) {
  var stage = document.getElementById('stage');
  stage.innerHTML = text;
  var svg = stage.querySelector('svg');
  ['legend', 'logo'].forEach(function (n) { var g = svg.querySelector('#layer-' + n); if (g) g.style.display = 'none'; });
  var over = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  over.id = 'over'; over.setAttribute('viewBox', '0 0 ' + W + ' ' + H); over.setAttribute('preserveAspectRatio', 'none');
  stage.appendChild(over);

  // ---------- 1. street mask ----------
  var cw = Math.round(W * S), ch = Math.round(H * S);
  var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  var ctx = cv.getContext('2d');
  ctx.scale(S, S); ctx.fillStyle = '#000';
  var used = 0;
  svg.querySelectorAll('#layer-streets path').forEach(function (p) {
    var fill = (p.getAttribute('fill') || '').toLowerCase();
    if (SIDE_STREETS.indexOf(fill) >= 0) return;
    ctx.fill(new Path2D(p.getAttribute('d')), p.getAttribute('fill-rule') === 'evenodd' ? 'evenodd' : 'nonzero');
    used++;
  });
  var px = ctx.getImageData(0, 0, cw, ch).data;
  var img = new Uint8Array(cw * ch), fg = [];
  for (var i = 0; i < cw * ch; i++) if (px[i * 4 + 3] > 127) { img[i] = 1; fg.push(i); }
  log('street shapes painted: ' + used + ', street pixels: ' + fg.length);

  // ---------- 1b. Zhang-Suen thinning ----------
  function thin() {
    var changed = true, iter = 0, del = [];
    var list = fg.slice();
    while (changed && iter < 200) {
      changed = false; iter++;
      for (var pass = 0; pass < 2; pass++) {
        del.length = 0;
        for (var k = 0; k < list.length; k++) {
          var p = list[k]; if (!img[p]) continue;
          var x = p % cw, y = (p - x) / cw;
          if (x < 1 || y < 1 || x >= cw - 1 || y >= ch - 1) { del.push(p); continue; }
          var p2 = img[p - cw], p3 = img[p - cw + 1], p4 = img[p + 1], p5 = img[p + cw + 1],
              p6 = img[p + cw], p7 = img[p + cw - 1], p8 = img[p - 1], p9 = img[p - cw - 1];
          var B = p2 + p3 + p4 + p5 + p6 + p7 + p8 + p9;
          if (B < 2 || B > 6) continue;
          var A = (!p2 && p3) + (!p3 && p4) + (!p4 && p5) + (!p5 && p6) + (!p6 && p7) + (!p7 && p8) + (!p8 && p9) + (!p9 && p2);
          if (A !== 1) continue;
          if (pass === 0 ? (p2 * p4 * p6 === 0 && p4 * p6 * p8 === 0) : (p2 * p4 * p8 === 0 && p2 * p6 * p8 === 0)) del.push(p);
        }
        if (del.length) { changed = true; for (var d = 0; d < del.length; d++) img[del[d]] = 0; }
      }
      list = list.filter(function (p) { return img[p]; });
    }
    return list;
  }
  var t0 = performance.now();
  var skel = thin();
  log('centre-line pixels: ' + skel.length + ' (' + Math.round(performance.now() - t0) + ' ms)');
  skeletonPts = skel;

  // ---------- 2. snap entrances ----------
  var pins = {}, snap = {}, entrances = {};
  ids.forEach(function (id) {
    var f = OC.stages[id]; if (!f) { log('no pin for ' + id); return; }
    var e = (OC.entrances && OC.entrances[id]) || f;
    var x = e[0] * W * S, y = e[1] * H * S, best = -1, bd = Infinity;
    for (var k = 0; k < skel.length; k++) {
      var p = skel[k], sx = p % cw, sy = (p - sx) / cw, dd = (sx - x) * (sx - x) + (sy - y) * (sy - y);
      if (dd < bd) { bd = dd; best = p; }
    }
    pins[id] = [f[0] * W, f[1] * H]; snap[id] = best;
    var bx = best % cw; entrances[id] = [Math.round(bx / S * 10) / 10, Math.round((best - bx) / cw / S * 10) / 10];
    log(id + ': entrance ' + (Math.sqrt(bd) / S).toFixed(1) + ' pt from ' + (OC.entrances && OC.entrances[id] ? 'its entrance point' : 'the pin') +
        ', hop to pin ' + Math.hypot(entrances[id][0] - pins[id][0], entrances[id][1] - pins[id][1]).toFixed(0) + ' pt');
  });

  // ---------- 3. shortest paths ----------
  var N = cw * ch;
  function dijkstra(src) {
    var dist = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1);   // 64-bit: a 32-bit store rounds and breaks the "stale entry" check
    var heap = [[0, src]]; dist[src] = 0;
    function push(e) { heap.push(e); var i = heap.length - 1; while (i > 0) { var pi = (i - 1) >> 1; if (heap[pi][0] <= heap[i][0]) break; var t = heap[pi]; heap[pi] = heap[i]; heap[i] = t; i = pi; } }
    function pop() { var top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; var i = 0; for (;;) { var l = 2 * i + 1, r = l + 1, m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; var t = heap[m]; heap[m] = heap[i]; heap[i] = t; i = m; } } return top; }
    var nb = [-cw - 1, -cw, -cw + 1, -1, 1, cw - 1, cw, cw + 1], cost = [1.4142, 1, 1.4142, 1, 1, 1.4142, 1, 1.4142];
    while (heap.length) {
      var e = pop(), d0 = e[0], u = e[1];
      if (d0 > dist[u]) continue;
      for (var k = 0; k < 8; k++) {
        var v = u + nb[k]; if (v < 0 || v >= N || !img[v]) continue;
        var nd = d0 + cost[k];
        if (nd < dist[v]) { dist[v] = nd; prev[v] = u; push([nd, v]); }
      }
    }
    return prev;
  }
  function simplify(pts, tol) {
    if (pts.length < 3) return pts;
    var keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
    var stack = [[0, pts.length - 1]];
    while (stack.length) {
      var s = stack.pop(), a = pts[s[0]], b = pts[s[1]], md = 0, mi = -1;
      var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1e-9;
      for (var i = s[0] + 1; i < s[1]; i++) {
        var d = Math.abs(dy * pts[i][0] - dx * pts[i][1] + b[0] * a[1] - b[1] * a[0]) / len;
        if (d > md) { md = d; mi = i; }
      }
      if (md > tol) { keep[mi] = 1; stack.push([s[0], mi], [mi, s[1]]); }
    }
    return pts.filter(function (_, i) { return keep[i]; });
  }
  var r1 = function (v) { return Math.round(v * 10) / 10; };
  var routes = {}, missing = [];
  t0 = performance.now();
  ids.forEach(function (a, ai) {
    var prev = dijkstra(snap[a]);
    ids.slice(ai + 1).forEach(function (b) {
      var cur = snap[b], chain = [];
      while (cur !== -1) { chain.push(cur); if (cur === snap[a]) break; cur = prev[cur]; }
      if (cur !== snap[a]) { missing.push(a + '|' + b); return; }
      chain.reverse();
      var pts = chain.map(function (p) { var x = p % cw; return [x / S, (p - x) / cw / S]; });
      pts = simplify(pts, SIMPLIFY);
      routes[a + '|' + b] = pts.map(function (p) { return [r1(p[0]), r1(p[1])]; });
    });
  });
  log('routes: ' + Object.keys(routes).length + ' traced in ' + Math.round(performance.now() - t0) + ' ms' +
      (missing.length ? '; NOT CONNECTED: ' + missing.join(', ') : ''));

  result = { built: new Date().toISOString().slice(0, 16).replace('T', ' '), width: W, height: H,
             note: 'Routes traced along the drawn streets by tools/poster-routes.html. Points are poster points [x, y]. ' +
                   'Each route runs entrance to entrance; the app adds the dotted hop from each entrance to its stage pin.',
             entrances: entrances, routes: routes };

  // ---------- 4. preview ----------
  var sel = document.getElementById('pair');
  Object.keys(routes).forEach(function (k) { sel.add(new Option(k.replace('|', ' → '), k)); });
  var COLORS = ['#ff6a00', '#ffe600', '#ff2bd6', '#00ff9c', '#ff3b3b', '#ffffff', '#9b7bff'];
  function draw() {
    over.innerHTML = '';
    var NS = 'http://www.w3.org/2000/svg', only = sel.value;
    if (document.getElementById('skel').checked) {
      var g = document.createElementNS(NS, 'g');
      skeletonPts.forEach(function (p, i) { if (i % 2) return; var x = p % cw, c = document.createElementNS(NS, 'rect');
        c.setAttribute('x', x / S); c.setAttribute('y', (p - x) / cw / S); c.setAttribute('width', 0.6); c.setAttribute('height', 0.6); c.setAttribute('fill', '#ff0'); g.appendChild(c); });
      over.appendChild(g);
    }
    Object.keys(routes).forEach(function (k, i) {
      if (only && k !== only) return;
      var pl = document.createElementNS(NS, 'polyline');
      pl.setAttribute('points', routes[k].map(function (p) { return p.join(','); }).join(' '));
      pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', only ? '#ff6a00' : COLORS[ids.indexOf(k.split('|')[0]) % COLORS.length]);
      pl.setAttribute('stroke-width', only ? 3 : 1.6); pl.setAttribute('stroke-linejoin', 'round'); pl.setAttribute('opacity', '.9');
      over.appendChild(pl);
    });
    ids.forEach(function (id) {
      var hop = document.createElementNS(NS, 'line');
      hop.setAttribute('x1', pins[id][0]); hop.setAttribute('y1', pins[id][1]); hop.setAttribute('x2', entrances[id][0]); hop.setAttribute('y2', entrances[id][1]);
      hop.setAttribute('stroke', '#fff'); hop.setAttribute('stroke-width', 1.4); hop.setAttribute('stroke-dasharray', '2 3');
      over.appendChild(hop);
    });
    ids.forEach(function (id) {
      var c = document.createElementNS(NS, 'circle'), t = document.createElementNS(NS, 'text');
      c.setAttribute('cx', pins[id][0]); c.setAttribute('cy', pins[id][1]); c.setAttribute('r', 5); c.setAttribute('fill', '#ff6a00'); c.setAttribute('stroke', '#fff');
      t.setAttribute('x', pins[id][0] + 7); t.setAttribute('y', pins[id][1] + 4); t.setAttribute('fill', '#fff'); t.setAttribute('font-size', 11); t.setAttribute('font-weight', 700); t.textContent = id;
      over.appendChild(c); over.appendChild(t);
    });
  }
  sel.addEventListener('change', draw);
  document.getElementById('skel').addEventListener('change', draw);
  draw();
  statusEl.textContent = missing.length ? 'Some stages are not connected by streets (see log)' : 'Traced ' + Object.keys(routes).length + ' routes';
  document.getElementById('save').disabled = !!missing.length;
  window.TRACED = { routes: Object.keys(routes).length, missing: missing };
  if (q.get('save') === '1' && !missing.length) save();
}).catch(function (err) { statusEl.textContent = 'Failed'; log(String(err && err.stack || err)); });

function save() {
  statusEl.textContent = 'Saving…';
  return fetch('/__save/poster-routes.json', { method: 'POST', headers: { 'X-FLTB-Save': '1', 'Content-Type': 'application/json' },
    body: JSON.stringify(result) }).then(function (r) { return r.text().then(function (t) { statusEl.textContent = (r.ok ? 'OK: ' : 'Error: ') + t; window.SAVED = r.ok; }); });
}
document.getElementById('save').addEventListener('click', save);
</script>
</body>
</html>
