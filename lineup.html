<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup · Fest like the Best</title>
<meta name="description" content="Pick the sets you want at Festival International de Louisiane, get a walking plan between stages, and print your schedule. A preview built with the 2026 lineup: try it and tell us what you think.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fest like the Best">
<meta property="og:title" content="Fest like the Best: plan your Festival International day">
<meta property="og:description" content="Pick the sets you want at Festival International de Louisiane, get a walking plan between stages, and print your schedule. A preview built with the 2026 lineup: try it and tell us what you think.">
<meta property="og:url" content="https://marceneaux98.github.io/fest-like-the-best/lineup.html">
<meta property="og:image" content="https://marceneaux98.github.io/fest-like-the-best/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Fest like the Best: the festival site map with walking routes between stages">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* Colours, fonts and base styles come from brand.css */
  :root { --hour: 128px; }           /* grid height of one hour: a 30-minute set has room for time, name and "Also" */
  body { min-height: 100vh; }

  /* ---------- header ---------- */
  header {
    background: linear-gradient(120deg, var(--blue), var(--purple));
    color: #fff; padding: 18px 24px 0;
  }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.4rem; letter-spacing: .01em; }
  h1 small { font-weight: 500; opacity: .85; font-size: .9rem; margin-left: 6px; }
  .total { font-size: .9rem; opacity: .95; text-align: right; line-height: 1.45; }  /* = Jost's own, so no jump when the font loads */
  .total b { font-variant-numeric: tabular-nums; }
  .total .stamp { display: block; font-size: .72rem; opacity: .8; margin-top: 2px; }
  .days { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
  /* Same height before and after the schedule loads, so nothing below jumps (layout shift) */
  .days { min-height: calc(22px + 2.2rem); }
  .days::-webkit-scrollbar { display: none; }
  .day {
    border: none; background: rgba(255,255,255,.14); color: #fff; padding: 10px 16px 12px;
    border-radius: 10px 10px 0 0; cursor: pointer; white-space: nowrap; text-align: left; line-height: 1.15;
  }
  .day span { display: block; font-size: .72rem; opacity: .85; text-transform: uppercase; letter-spacing: .06em; }
  .day strong { font-size: 1rem; }
  .day .badge {
    display: inline-block; min-width: 18px; padding: 1px 6px; margin-left: 6px; border-radius: 999px;
    background: var(--orange); color: #fff; font-size: .72rem; font-weight: 700; text-align: center; vertical-align: 2px;
  }
  .day[aria-selected="true"] { background: var(--bg); color: var(--ink); }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--bg);
    position: sticky; top: 0; z-index: 20;
  }
  .search {
    flex: 1 1 220px; min-width: 0; padding: 9px 12px; font-size: .95rem; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink);
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: none; background: none; padding: 8px 14px; cursor: pointer; font-size: .88rem; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--purple); color: #fff; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .chk input { accent-color: var(--purple); width: 16px; height: 16px; }
  /* Opens print.html (black-and-white schedule to print or save as PDF) on the day shown here */
  .print-link {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--purple);
    font-size: .88rem; font-weight: 600; text-decoration: none;
  }
  .print-link:hover { background: var(--bg); }
  .print-link:focus-visible { outline: 3px solid var(--orange); outline-offset: 1px; }

  /* ---------- layout ---------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 0; align-items: start; }
  .board { padding: 16px 24px 40px; min-width: 0; }

  /* ---------- grid view ---------- */
  .grid-wrap {
    overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff;
    max-height: calc(100vh - 190px); min-height: 360px;
  }
  .grid .corner { left: 0; z-index: 4; }
  .times { position: sticky; left: 0; z-index: 2; background: #fff; }
  .grid { display: grid; position: relative; min-width: 840px; }
  /* Column heads filled with each stage's poster colour (the "ink" shade, so the white name stays readable) */
  .grid .corner, .grid .stage-head {
    position: sticky; top: 0; z-index: 3; background: #fff; border-bottom: 1px solid var(--line);
    padding: 10px 6px; font-size: .8rem; font-weight: 700; text-align: center; line-height: 1.2;
  }
  /* Stage names in the festival's condensed display face, on the deep stage colour, with the bright
     poster colour as a band underneath */
  .grid .stage-head {
    background: linear-gradient(180deg, var(--stage-ink), color-mix(in srgb, var(--stage-ink) 80%, #000));
    color: #fff; border-bottom: 5px solid var(--stage); box-shadow: inset -1px 0 rgba(255,255,255,.3);
    display: flex; align-items: center; justify-content: center; padding: 10px 4px 8px;
    font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; line-height: 1.05;
    text-transform: uppercase; letter-spacing: .04em; text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .grid .corner { border-bottom-width: 5px; }
  .times { border-right: 1px solid var(--line); }
  .times div {
    position: absolute; right: 8px; font-size: .76rem; font-weight: 600; color: var(--ink);
    transform: translateY(-50%); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .col { position: relative; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--stage) 3%, #fff); }
  .col:last-child { border-right: none; }
  .hourline { position: absolute; left: 0; right: 0; border-top: 1px solid #ebe8f0; }
  .hourline.half { border-top: 1px dashed #f0eef4; }

  /* ---------- a set on the grid ----------
     Top: a full-width time bar in the stage colour (bold white time; wraps at the dash only if it must).
     Below: the name across the full block width (up to 3 lines), the origin, and, pinned to the
     bottom, the artist's other shows ("Also: Sun 2 PM", a check mark = already in the plan).
     Right end, touching the bottom of the time bar: the artist ("Bio") button; the name's first line stops short of it.
     Picked: the block turns solid stage colour and the time bar flips to white. */
  .set {
    position: absolute; left: 3px; right: 3px; border-radius: 8px; overflow: hidden; container-type: inline-size;
    background: color-mix(in srgb, var(--stage) 15%, #fff); border: 1px solid color-mix(in srgb, var(--stage) 50%, #fff);
    transition: box-shadow .12s, background-color .12s;
  }
  /* The whole block adds/removes the set; the artist button in its corner opens the artist sheet (artist.js) */
  .set-hit {
    display: flex; flex-direction: column; width: 100%; height: 100%; padding: 0;
    border: none; background: none; color: inherit; text-align: left; cursor: pointer; font: inherit;
  }
  .set:hover { box-shadow: 0 3px 10px rgba(0,0,0,.14); z-index: 2; }
  .set:has(.set-hit:focus-visible) { outline: 3px solid var(--orange); outline-offset: 1px; }
  .set-hit:focus-visible { outline: none; }
  .set .when {
    flex: none; min-height: 24px; padding: 4px 7px; line-height: 1.15;
    background: var(--stage-ink); color: #fff; letter-spacing: .01em;
    font-size: .76rem; font-weight: 700; overflow: hidden;
  }
  .set .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2px; padding: 4px 7px 5px; overflow: hidden; }
  .set .act {
    font-weight: 700; font-size: .84rem; line-height: 1.15; color: var(--ink); flex-shrink: 0;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere;
  }
  /* room for the artist button beside the name's first lines (--bar = time bar height, set by fitSets) */
  .set.has-bio .act::before { content: ""; float: right; width: 22px; height: 1.1em; }
  .set .tk { font-weight: 800; }
  /* Where the artist is from: bold, in a dark shade of the stage colour */
  .set .origin {
    flex-shrink: 0; font-size: .74rem; font-weight: 600; color: color-mix(in srgb, var(--stage-ink) 70%, var(--ink));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .set .info-btn {
    position: absolute; right: 2px; top: calc(var(--bar, 24px) - 4px); width: 24px; min-width: 24px; height: 24px;
    background: #fff; color: var(--stage-ink); box-shadow: 0 0 0 1px color-mix(in srgb, var(--stage) 45%, #fff);
  }
  .set .info-btn:hover { background: color-mix(in srgb, var(--stage) 12%, #fff); }
  .set .info-btn svg { width: 16px; height: 16px; }
  /* Wide columns (big screens): room for the word "Bio" */
  @container (min-width: 165px) {
    .set .info-btn, .set.short .info-btn { width: auto; padding: 0 8px 0 5px; }
    .set .info-btn .lbl { display: inline; }
    .set.has-bio .act::before { width: 50px; }
  }

  .set.picked { background: var(--stage-ink); border-color: var(--stage-ink); color: #fff; box-shadow: 0 2px 8px color-mix(in srgb, var(--stage-ink) 45%, transparent); }
  .set.picked .when { background: #fff; color: var(--stage-ink); }
  .set.picked .act { color: #fff; }
  .set.picked .origin { color: #fff; }
  .set.picked .info-btn { box-shadow: none; }
  .set.conflict { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--danger); }
  .set.dim { opacity: .28; }
  /* 30-minute sets: time bar + one line of name */
  .set.short .when { min-height: 20px; padding-top: 2px; padding-bottom: 2px; }
  .set.short .info-btn { width: 22px; min-width: 22px; height: 22px; top: calc(var(--bar, 20px) - 3px); right: 1px; }
  .set.short .info-btn svg { width: 14px; height: 14px; }
  .set.short .body { padding-top: 1px; padding-bottom: 1px; }
  .set.short .act, .set.short.has-also .act { -webkit-line-clamp: 1; font-size: .8rem; }
  .set.short .origin, .set.short .also-days { display: none; }

  /* ---------- list view ---------- */
  .slot { margin-bottom: 18px; }
  .slot h3 { margin: 0 0 8px; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .card {
    position: relative;
    background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--stage); border-radius: 10px;
  }
  .card-hit {
    display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; text-align: left; cursor: pointer;
    width: 100%; height: 100%; padding: 10px 12px; border: none; background: none; color: inherit; border-radius: inherit; font: inherit;
  }
  .card:hover { border-color: color-mix(in srgb, var(--stage) 50%, var(--line)); border-left-color: var(--stage); }
  .card:has(.card-hit:focus-visible) { outline: 3px solid var(--orange); outline-offset: 1px; }
  .card-hit:focus-visible { outline: none; }
  /* "Bio" pill, top right, beside the time line (which leaves room for it) */
  .card .info-btn {
    position: absolute; top: 8px; right: 8px; height: 30px; padding: 0 11px 0 8px;
    background: color-mix(in srgb, var(--stage) 12%, #fff); color: var(--stage-ink);
    border: 1px solid color-mix(in srgb, var(--stage) 35%, #fff);
  }
  .card .info-btn .lbl { display: inline; }
  .card .info-btn:hover { background: color-mix(in srgb, var(--stage) 22%, #fff); }
  .card .when-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 26px; padding-right: 84px; }
  .card .when {
    display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--stage-ink); color: #fff;
    font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .card .stg { font-size: .8rem; font-weight: 700; color: var(--stage-ink); }
  .tick {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid color-mix(in srgb, var(--stage) 60%, #fff);
    display: grid; place-items: center; font-weight: 800; font-size: .8rem; color: #fff; margin-top: 1px;
  }
  .card.picked { background: color-mix(in srgb, var(--stage) 9%, #fff); }
  .card.picked .tick { background: var(--stage); border-color: var(--stage); }
  .card .act { font-weight: 700; font-size: 1rem; margin-top: 6px; line-height: 1.2; }
  .card .meta { font-size: .82rem; font-weight: 600; color: color-mix(in srgb, var(--stage-ink) 70%, var(--ink)); margin-top: 2px; }
  .card .also { font-size: .75rem; color: var(--purple); margin-top: 4px; }
  .card .warn, .pick .warn { font-size: .75rem; color: var(--danger); font-weight: 600; margin-top: 4px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* ---------- picks panel ---------- */
  .panel {
    position: sticky; top: 66px; margin: 16px 24px 24px 0; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; max-height: calc(100vh - 90px); overflow-y: auto;
  }
  .panel h2 { margin: 0; font-size: 1rem; color: var(--purple); }
  .panel .sub { margin: 2px 0 12px; font-size: .8rem; color: var(--muted); }
  .pick {
    border-left: 4px solid var(--stage); padding: 6px 0 6px 10px; margin-bottom: 8px; position: relative;
  }
  .pick .t { font-size: .8rem; font-weight: 700; color: var(--stage-ink); font-variant-numeric: tabular-nums; }
  .pick .act { font-weight: 700; font-size: .9rem; padding-right: 22px; }
  .pick .st { font-size: .78rem; color: var(--muted); }
  .pick .x {
    position: absolute; top: 4px; right: 0; border: none; background: none; cursor: pointer; color: var(--muted);
    font-size: 1rem; line-height: 1; padding: 2px 4px; border-radius: 4px;
  }
  .pick .x:hover { background: var(--bg); color: var(--ink); }
  .panel .none { font-size: .85rem; color: var(--muted); padding: 8px 0 4px; }
  .panel-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .btn {
    border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: .9rem;
  }
  .btn.primary { background: var(--orange); color: #fff; }
  .btn.primary:disabled { background: #e9e6ef; color: var(--muted); cursor: not-allowed; }
  .btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--bg); }
  .soon { font-size: .75rem; color: var(--muted); text-align: center; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 12px; font-size: .78rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  /* Key: what the check mark and the artist button mean (grid and list) */
  .legend .key { color: var(--ink); }
  .legend .key-pick {
    display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px;
    background: var(--purple); color: #fff; font-size: .72rem; font-weight: 800;
  }
  .legend .key-bio {
    display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px 0 5px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--purple); font-weight: 700; font-size: .72rem;
  }
  .legend .key-bio svg { width: 14px; height: 14px; }
  .legend .sep { width: 1px; align-self: stretch; background: var(--line); }

  /* Phone: picks summary + Plan button pinned to the bottom of the screen */
  .dock { display: none; }
  .dock-info { flex: 1; min-width: 0; text-align: left; border: none; background: none; cursor: pointer; padding: 0; }
  .dock-info b { display: block; font-size: 1rem; }
  .dock-info span { display: block; font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dock-info span.bad { color: var(--danger); font-weight: 600; }
  .dock .btn { flex: 0 0 auto; }

  /* Other shows by an artist already in the plan */
  .set.twin { border-style: dashed; border-left-style: solid; }

  /* "Also: Sat 2:15 PM · Sun 2 PM" pinned to the bottom of each grid block */
  .set .also-days {
    flex-shrink: 0; margin-top: auto; padding-top: 3px; border-top: 1px dashed color-mix(in srgb, var(--stage) 45%, transparent);
    font-size: .68rem; font-weight: 700; line-height: 1.25; color: var(--stage-ink);
  }
  .set.picked .also-days { color: #fff; border-top-color: rgba(255, 255, 255, .5); }
  .set.has-also .act { -webkit-line-clamp: 2; }                 /* leave room for the "Also" line */
  /* 45–55 min blocks: two-line name (one when there is an "Also" line), one-line "Also" */
  .set.compact .act { -webkit-line-clamp: 2; }
  .set.compact .when { min-height: 22px; padding-top: 3px; padding-bottom: 3px; }
  .set.compact .body { padding-top: 2px; padding-bottom: 2px; }
  .set.compact .also-days { padding-top: 2px; line-height: 1.15; }
  .set.compact.has-also .act { -webkit-line-clamp: 1; }
  .set.compact .also-days, .set.one-also .also-days { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .twin-tag {
    display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--purple) 12%, #fff); color: var(--purple); font-size: .75rem; font-weight: 600;
  }

  /* "Already in your schedule" dialog */
  .dup {
    border: none; border-radius: 16px; padding: 0; width: min(420px, calc(100vw - 32px));
    box-shadow: 0 20px 50px rgba(28, 27, 34, .3); color: var(--ink);
  }
  .dup::backdrop { background: rgba(28, 27, 34, .45); }
  .dup form { padding: 20px; }
  .dup h2 {
    margin: 0 0 8px; color: var(--purple); font-size: 1.15rem;
    font-family: var(--font-headline, inherit); font-style: italic; font-weight: 700; text-transform: uppercase;
  }
  .dup p { margin: 0; font-size: .95rem; }
  .dup ul { margin: 8px 0 12px; padding-left: 20px; font-weight: 600; }
  .dup .dup-this { color: var(--muted); font-size: .88rem; }
  .dup-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .btn.link { background: none; color: var(--muted); text-decoration: underline; padding-left: 6px; padding-right: 6px; }

  @media (max-width: 900px) {
    .dock {
      display: flex; align-items: center; gap: 12px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    }
    body { padding-bottom: 80px; }
    header { padding: 14px 16px 0; }
    .toolbar { padding: 10px 16px; }
    main { grid-template-columns: 1fr; }
    .board { padding: 12px 16px 24px; }
    .panel { position: static; margin: 0 16px 24px; max-height: none; }
    /* The picks panel sits under the schedule here: show it only once the schedule is drawn,
       so it appears in place instead of jumping (layout shift) when the sets load */
    main:has(#view:empty) .panel { display: none; }
  }
</style>

<body>
<div class="brand-bar" data-page="lineup"></div>
<header>
  <div class="title-row">
    <h1><span data-i18n="lu_title">Lineup 2026</span> <small data-i18n="lu_sub">Pick the sets you want to see</small></h1>
    <div class="total" id="total"><span data-i18n="lu_total_none">Tap any set to add it to your plan</span><small class="stamp">&nbsp;</small></div>
  </div>
  <nav class="days" id="days" role="tablist" data-i18n-aria="lu_days_aria" aria-label="Festival days"></nav>
</header>

<div class="toolbar">
  <input class="search" id="search" type="search" data-i18n-ph="lu_search_ph" data-i18n-aria="lu_search_aria" placeholder="Search artists, countries, stages…" aria-label="Search">
  <div class="seg" role="group" data-i18n-aria="lu_view_aria" aria-label="View">
    <button type="button" id="viewGrid" aria-pressed="true" data-i18n="lu_grid">Grid</button>
    <button type="button" id="viewList" aria-pressed="false" data-i18n="lu_list">List</button>
  </div>
  <label class="chk"><input type="checkbox" id="onlyPicked"> <span data-i18n="lu_only">Only my picks</span></label>
  <a class="print-link" href="print.html"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg><span data-i18n="pr_btn">Print / Save as PDF</span></a>
</div>

<main>
  <section class="board">
    <div class="legend" id="legend"></div>
    <div id="view"></div>
  </section>
  <aside class="panel" aria-live="polite">
    <h2 id="panelTitle">&nbsp;</h2>
    <p class="sub" id="panelSub" data-i18n="lu_nothing_day">Nothing picked for this day yet.</p>
    <div id="picks"><div class="none" data-i18n="lu_tap_build">Tap sets to build your day.</div></div>
    <div class="panel-actions">
      <button class="btn primary" id="planBtn" type="button" disabled data-i18n="lu_plan_btn">Plan my route →</button>
      <div class="soon" id="planHint" data-i18n="lu_hint_need">Pick at least two sets to plan a route.</div>
      <button class="btn ghost" id="clearDay" type="button" style="display:none" data-i18n="lu_clear_day">Clear this day</button>
    </div>
  </aside>
</main>
<div class="dock" id="dock">
  <button class="dock-info" id="dockInfo" type="button" data-i18n-aria="lu_dock_aria" aria-label="Review my picks for this day">
    <b id="dockCount">&nbsp;</b><span id="dockSub" data-i18n="lu_dock_add">Tap a set to add it</span>
  </button>
  <button class="btn primary" id="dockPlan" type="button" data-i18n="lu_plan_btn">Plan my route →</button>
</div>

<!-- "Already in your schedule" prompt -->
<dialog class="dup" id="dup" aria-labelledby="dupTitle">
  <form method="dialog">
    <h2 id="dupTitle" data-i18n="dup_title">Already in your schedule</h2>
    <p id="dupBody"></p>
    <ul id="dupList"></ul>
    <p class="dup-this" id="dupThis"></p>
    <div class="dup-btns">
      <button class="btn primary" value="swap" data-i18n="dup_swap">Switch to this show</button>
      <button class="btn ghost" value="keep" data-i18n="dup_keep">Keep both</button>
      <button class="btn link" value="cancel" data-i18n="dup_cancel">Cancel</button>
    </div>
  </form>
</dialog>

<script src="i18n.js"></script>
<script src="routes.js"></script>
<script src="common.js"></script>
<script src="artist.js"></script>
<script>
FIL.ready(function () {
  var S = window.SCHEDULE_DATA, T = I18N.t, TN = I18N.tn;
  var esc = FIL.esc, toMin = FIL.toMin, load = FIL.store.get, save = FIL.store.set;
  var view = document.getElementById('view');
  if (!S) { view.innerHTML = '<div class="empty">Could not load the schedule (' + esc(window.SCHEDULE_ERROR || '') + '). Run python build_feed.py, and open the site through python serve.py.</div>'; return; }

  // Stages (name, colour, display order) come from locations.json via routes.js.
  var STAGES = FIL.stages, stageById = FIL.stageById;
  if (!STAGES.length) { view.innerHTML = '<div class="empty">routes.js not found — run: python build_routes.py</div>'; return; }

  var perfs = S.performances;
  var byId = {}; perfs.forEach(function (p) { byId[p.id] = p; p.s = toMin(p.start); p.e = toMin(p.end); });

  // Repeating entries that aren't artists, so picking them twice is normal.
  var NOT_ARTISTS = /^(Dance to Festival Playlist|Opening Ceremonies)/i;

  // ---------- state (remembered in this browser) ----------
  var picks = new Set(load('fil-picks', []).filter(function (id) { return byId[id]; }));
  var state = {
    day: load('fil-day', S.days[0].date),
    view: load('fil-view', window.innerWidth < 760 ? 'list' : 'grid'),
    q: '',
    only: false
  };
  if (!S.days.some(function (d) { return d.date === state.day; })) state.day = S.days[0].date;

  // ---------- helpers ----------
  function fmt(m) { return I18N.time(m, true); }
  // English: "4–5:15 PM" instead of "4 PM–5:15 PM" when both are AM or both PM (see common.js)
  function fmtRange(p) { return FIL.timeRange(p.s, p.e); }
  // Grid blocks are narrow: French "14 h 30–15 h 45" becomes "14h30–15h45", as festival programmes print it,
  // and a shared am/pm is written once in every language ("12:45 p.m.–2 p.m." -> "12:45–2 p.m.", like English)
  function tight(s) {
    if (I18N.lang === 'fr') s = s.replace(/(\d)[\s  ]*h[\s  ]*/g, '$1h');
    return s.replace(/^(\d[\d:.]*)([\s  ]*[^\d\s  –][^\d–]*)–(\d[\d:.]*)\2$/, '$1–$3$2');
  }
  function when(q) { return I18N.weekdayShort(q.date) + ' ' + fmt(q.s) + ' · ' + stageById[q.stage].name; }
  function matches(p) {
    if (state.only && !picks.has(p.id)) return false;
    if (!state.q) return true;
    var hay = (p.act + ' ' + p.origin + ' ' + stageById[p.stage].name + ' ' + p.note).toLowerCase();
    return state.q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }
  function dayPicks(date) {
    return perfs.filter(function (p) { return p.date === date && picks.has(p.id); }).sort(function (a, b) { return a.s - b.s; });
  }
  // Picked sets on the same day that overlap in time.
  function conflictsOf(p) {
    if (!picks.has(p.id)) return [];
    return dayPicks(p.date).filter(function (q) { return q.id !== p.id && q.s < p.e && p.s < q.e; });
  }
  function otherShows(p) {
    return perfs.filter(function (q) { return q.act === p.act && q.id !== p.id; });
  }
  // Other performances by the same artist that are already in the plan.
  function pickedTwins(p) {
    if (NOT_ARTISTS.test(p.act)) return [];
    return otherShows(p).filter(function (q) { return picks.has(q.id); })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.s - b.s; });
  }

  function commit() { save('fil-picks', Array.from(picks)); render(); }
  // "About this artist" sheet (artist.js): its add/remove button goes through toggle(), so it asks
  // "switch / keep both" like a tap on the grid does.
  FIL.artist.setup({ perfs: perfs, isPicked: function (id) { return picks.has(id); }, toggle: toggle });
  function toggle(id) {
    if (picks.has(id)) { picks.delete(id); commit(); return; }
    var p = byId[id], twins = pickedTwins(p);
    if (!twins.length) { picks.add(id); commit(); return; }
    askDuplicate(p, twins);
  }

  // ---------- "already in your schedule" prompt ----------
  var dlg = document.getElementById('dup');
  function askDuplicate(p, twins) {
    if (!dlg.showModal) { picks.add(p.id); commit(); return; } // very old browsers: just add it
    document.getElementById('dupBody').textContent = T('dup_body', { act: p.act });
    document.getElementById('dupList').innerHTML = twins.map(function (q) { return '<li>' + esc(when(q)) + '</li>'; }).join('');
    document.getElementById('dupThis').textContent = T('dup_this', { when: when(p) });
    dlg.returnValue = '';
    dlg.onclose = function () {
      dlg.onclose = null;
      if (dlg.returnValue === 'swap') { twins.forEach(function (q) { picks.delete(q.id); }); picks.add(p.id); }
      else if (dlg.returnValue === 'keep') { picks.add(p.id); }
      else return;
      commit();
    };
    dlg.showModal();
  }
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close('cancel'); }); // tap outside = cancel

  // ---------- rendering ----------
  function renderDays() {
    var el = document.getElementById('days');
    el.innerHTML = S.days.map(function (d) {
      var n = dayPicks(d.date).length;
      return '<button class="day" role="tab" data-day="' + d.date + '" aria-selected="' + (d.date === state.day) + '">' +
        '<span>' + esc(I18N.weekday(d.date)) + '</span><strong>' + esc(I18N.monthDay(d.date)) + '</strong>' +
        (n ? '<em class="badge">' + n + '</em>' : '') + '</button>';
    }).join('');
    var all = picks.size;
    document.getElementById('total').innerHTML = (all ? TN('lu_total', all) : esc(T('lu_total_none'))) +
      '<small class="stamp">' + (S.updated ? esc(T('lu_updated', { when: FIL.stamp(S.updated) })) : '&nbsp;') + '</small>';
  }

  // Grid: the stage colours are on the column heads, so only the key. List: stage colours, then the key.
  function renderLegend(dayPerfs) {
    var used = STAGES.filter(function (s) { return dayPerfs.some(function (p) { return p.stage === s.id; }); });
    var key = '<span class="key"><b class="key-pick" aria-hidden="true">✓</b>' + esc(T('art_in_plan')) + '</span>' +
      '<span class="key"><span class="key-bio" aria-hidden="true">' + FIL.artist.icon + esc(T('art_bio_btn')) + '</span>' +
      esc(T('lu_key_bio')) + '</span>';
    document.getElementById('legend').innerHTML = !dayPerfs.length ? '' : state.view === 'list'
      ? used.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>'; }).join('') +
        '<span class="sep" aria-hidden="true"></span>' + key
      : key;
  }

  function renderGrid(dayPerfs) {
    var stages = STAGES.filter(function (s) { return dayPerfs.some(function (p) { return p.stage === s.id; }); });
    if (!dayPerfs.length) { view.innerHTML = '<div class="empty">' + esc(T('lu_empty_day')) + '</div>'; return; }
    var t0 = Math.floor(Math.min.apply(null, dayPerfs.map(function (p) { return p.s; })) / 60) * 60;
    var t1 = Math.ceil(Math.max.apply(null, dayPerfs.map(function (p) { return p.e; })) / 60) * 60;
    var hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour')) || 96;
    var ppm = hourPx / 60, height = (t1 - t0) * ppm;

    var h = '<div class="grid-wrap"><div class="grid" style="grid-template-columns: 64px repeat(' + stages.length + ', minmax(110px, 1fr))">';
    h += '<div class="corner"></div>';
    stages.forEach(function (s) { h += '<div class="stage-head" style="--stage:' + s.color + ';--stage-ink:' + s.ink + '">' + esc(s.name) + '</div>'; });

    h += '<div class="times" style="height:' + height + 'px">';
    for (var t = t0; t <= t1; t += 60) h += '<div style="top:' + Math.max(8, Math.min(height - 8, (t - t0) * ppm)) + 'px">' + esc(fmt(t)) + '</div>';
    h += '</div>';

    stages.forEach(function (s) {
      h += '<div class="col" style="--stage:' + s.color + ';height:' + height + 'px">';
      for (var t = t0; t < t1; t += 30) h += '<div class="hourline' + (t % 60 ? ' half' : '') + '" style="top:' + (t - t0) * ppm + 'px"></div>';
      dayPerfs.filter(function (p) { return p.stage === s.id; }).forEach(function (p) {
        var top = (p.s - t0) * ppm, ht = Math.max(40, (p.e - p.s) * ppm - 3);
        var on = picks.has(p.id), twins = on ? [] : pickedTwins(p);
        var cls = 'set' + (on ? ' picked' : '') + (FIL.artist.has(p) ? ' has-bio' : '') + (twins.length ? ' twin' : '') + (otherShows(p).length ? ' has-also' : '') + (conflictsOf(p).length ? ' conflict' : '') +
          (matches(p) ? '' : ' dim') + (ht < 48 ? ' short' : ht < 90 ? ' compact' : '');
        var others = otherShows(p);
        var tip = p.act + (p.origin ? ' (' + p.origin + ')' : '') + ' · ' + fmtRange(p) + (p.note ? '\n' + p.note : '') +
          (others.length ? '\n' + T('lu_also', { list: others.map(function (q) { return (picks.has(q.id) ? '✓ ' : '') + when(q); }).join('; ') }) : '');
        // Bottom line: the artist's other shows (day + time), ✓ = already in the plan
        var alsoLine = others.length
          ? '<span class="also-days">' + esc(T('lu_also', { list: others.map(function (q) {
              // no-break spaces keep "Sun 12:30 PM" on one line; the list wraps between shows
              return ((picks.has(q.id) ? '✓ ' : '') + I18N.weekdayShort(q.date) + ' ' + tight(fmt(q.s))).replace(/ /g, ' ');
            }).join(' · ') })) + '</span>'
          : '';
        h += '<div class="' + cls + '" style="--stage:' + s.color + ';--stage-ink:' + s.ink + ';top:' + (top + 1) + 'px;height:' + ht + 'px">' +
          '<button type="button" class="set-hit" data-id="' + p.id + '" aria-pressed="' + on + '" title="' + esc(tip) + '">' +
          // no-break spaces: if a long time must wrap ("11:45 AM–12:45 PM"), it breaks only at the dash
          '<span class="when">' + esc(tight(fmtRange(p))).replace(/ /g, '&nbsp;') + '</span><span class="body">' +
          '<span class="act">' + (on ? '<span class="tk" aria-hidden="true">✓ </span>' : '') + esc(p.act) + '</span>' +
          (p.origin ? '<span class="origin">' + esc(p.origin) + '</span>' : '') +
          alsoLine + '</span></button>' + FIL.artist.button(p) + '</div>';
      });
      h += '</div>';
    });
    view.innerHTML = h + '</div></div>';
    fitSets();
  }

  // Names, "Also" lists and translations vary in length, so after drawing, a block that is too full
  // gives up its origin line first, then shortens "Also" to one line, then name lines (down to one).
  // The time always stays: if it runs onto two lines, its text first gets a little smaller (to .68rem).
  function fitSets() {
    // Stage names: as large as the column allows (long ones like INTERNATIONALE shrink on phones)
    var range = document.createRange();
    view.querySelectorAll('.stage-head').forEach(function (h) {
      var fs = 1.05, room = h.clientWidth - 8;
      function widest() {
        range.selectNodeContents(h);
        return Math.max.apply(null, Array.prototype.map.call(range.getClientRects(), function (r) { return r.width; }));
      }
      while (widest() > room && fs > 0.75) { fs -= 0.05; h.style.fontSize = fs + 'rem'; }
    });
    view.querySelectorAll('.set').forEach(function (set) {
      var w = set.querySelector('.when'), fs = 0.76;
      range.selectNodeContents(w);
      while (range.getClientRects().length > 1 && fs > 0.69) { fs -= 0.02; w.style.fontSize = fs + 'rem'; }
      set.style.setProperty('--bar', w.offsetHeight + 'px'); // the artist button sits just below the time bar

      var b = set.querySelector('.body');
      function over() { return b.scrollHeight > b.clientHeight + 1; }
      if (over()) {
        var o = b.querySelector('.origin'), a = b.querySelector('.act');
        if (o) o.remove();
        if (over() && b.querySelector('.also-days')) set.classList.add('one-also');
        var n = parseInt(getComputedStyle(a).webkitLineClamp, 10) || 3;
        while (over() && n > 1) a.style.webkitLineClamp = --n;
      }
      // In short blocks the origin or "Also" line can sit beside the artist button: keep it clear
      var btn = set.querySelector('.info-btn');
      if (btn) {
        var bottom = btn.getBoundingClientRect().bottom, room = btn.offsetWidth + 4 + 'px';
        b.querySelectorAll('.origin, .also-days').forEach(function (el) {
          if (el.getBoundingClientRect().top < bottom - 1) el.style.paddingRight = room;
        });
      }
    });
  }

  function renderList(dayPerfs) {
    var shown = dayPerfs.filter(matches);
    if (!shown.length) {
      view.innerHTML = '<div class="empty">' + esc(T(state.only ? 'lu_empty_picks' : 'lu_empty_search')) + '</div>';
      return;
    }
    var groups = [], cur = null;
    shown.forEach(function (p) {
      if (!cur || cur.s !== p.s) { cur = { s: p.s, items: [] }; groups.push(cur); }
      cur.items.push(p);
    });
    view.innerHTML = groups.map(function (g) {
      return '<div class="slot"><h3>' + esc(fmt(g.s)) + '</h3><div class="cards">' + g.items.map(function (p) {
        var s = stageById[p.stage], on = picks.has(p.id), c = conflictsOf(p);
        var twins = on ? [] : pickedTwins(p);
        var also = otherShows(p).filter(function (q) { return twins.indexOf(q) < 0; });
        return '<div class="card' + (on ? ' picked' : '') + (twins.length ? ' twin' : '') + '" style="--stage:' + s.color + ';--stage-ink:' + s.ink + '">' +
          '<button type="button" class="card-hit" data-id="' + p.id + '" aria-pressed="' + on + '">' +
          '<span class="tick">' + (on ? '✓' : '') + '</span><span>' +
          '<div class="when-row"><span class="when">' + esc(fmtRange(p)) + '</span><span class="stg">' + esc(s.name) + '</span></div>' +
          '<div class="act">' + esc(p.act) + '</div>' +
          (p.origin ? '<div class="meta">' + esc(p.origin) + '</div>' : '') +
          (twins.length ? '<div class="twin-tag">✓ ' + esc(T('dup_badge', { when: twins.map(when).join('; ') })) + '</div>' : '') +
          (c.length ? '<div class="warn">' + esc(T('lu_overlaps', { acts: c.map(function (q) { return q.act; }).join(', ') })) + '</div>' : '') +
          (also.length ? '<div class="also">' + esc(T('lu_also', { list: also.map(when).join('; ') })) + '</div>' : '') +
          '</span></button>' + FIL.artist.button(p) + '</div>';
      }).join('') + '</div></div>';
    }).join('');
  }

  function renderPanel() {
    var list = dayPicks(state.day), wd = I18N.weekday(state.day);
    document.getElementById('panelTitle').textContent = T('lu_my_day', { weekday: wd });
    var conflicts = list.filter(function (p) { return conflictsOf(p).length; }).length;
    document.getElementById('panelSub').textContent = list.length
      ? TN('sets', list.length) + ' · ' + (conflicts ? TN('overlapping', conflicts) : T('no_overlaps'))
      : T('lu_nothing_day');
    document.getElementById('picks').innerHTML = list.length ? list.map(function (p) {
      var s = stageById[p.stage], c = conflictsOf(p);
      return '<div class="pick" style="--stage:' + s.color + ';--stage-ink:' + s.ink + '"><div class="t">' + esc(fmtRange(p)) + '</div>' +
        '<div class="act">' + esc(p.act) + '</div><div class="st">' + esc(s.name) + '</div>' +
        (c.length ? '<div class="warn">' + esc(T('lu_overlaps', { acts: c.map(function (q) { return q.act; }).join(', ') })) + '</div>' : '') +
        '<button class="x" type="button" data-remove="' + p.id + '" aria-label="' + esc(T('lu_remove', { act: p.act })) + '">×</button></div>';
    }).join('') : '<div class="none">' + esc(T('lu_tap_build')) + '</div>';
    document.getElementById('planBtn').disabled = list.length < 2;
    document.getElementById('planHint').textContent = T(list.length < 2 ? 'lu_hint_need' : 'lu_hint_ok');
    document.getElementById('clearDay').style.display = list.length ? '' : 'none';

    // Phone dock
    document.getElementById('dockCount').textContent = list.length
      ? T('lu_dock_count', { sets: TN('sets', list.length), weekday: wd })
      : T('lu_dock_none', { weekday: wd });
    var sub = document.getElementById('dockSub');
    sub.textContent = !list.length ? T('lu_dock_add') : conflicts ? TN('lu_dock_overlap', conflicts) : T('lu_dock_review');
    sub.className = conflicts ? 'bad' : '';
    document.getElementById('dockPlan').disabled = list.length < 2;
  }

  // Redrawing replaces the grid/list, which would reset the grid's own scroll box (and can nudge the page).
  // When only picks/search changed (same day + view), put every scroll position and keyboard focus back.
  var lastKey = null;
  function render() {
    var key = state.day + '|' + state.view, same = key === lastKey;
    var gw = view.querySelector('.grid-wrap'), days = document.getElementById('days');
    var keep = { x: window.scrollX, y: window.scrollY, gt: gw ? gw.scrollTop : 0, gl: gw ? gw.scrollLeft : 0, dl: days.scrollLeft };
    var focusId = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.id : null;

    var dayPerfs = perfs.filter(function (p) { return p.date === state.day; });
    renderDays();
    renderLegend(dayPerfs);
    if (state.view === 'grid') renderGrid(dayPerfs); else renderList(dayPerfs);
    renderPanel();
    document.getElementById('viewGrid').setAttribute('aria-pressed', state.view === 'grid');
    document.getElementById('viewList').setAttribute('aria-pressed', state.view === 'list');

    days.scrollLeft = keep.dl;
    if (same) {
      var ngw = view.querySelector('.grid-wrap');
      if (ngw) { ngw.scrollTop = keep.gt; ngw.scrollLeft = keep.gl; }
      window.scrollTo(keep.x, keep.y);
      if (focusId) {
        var f = view.querySelector('[data-id="' + focusId + '"]');
        if (f) f.focus({ preventScroll: true });
      }
    }
    lastKey = key;
    FIL.artist.refresh();
  }

  // ---------- events ----------
  document.getElementById('days').addEventListener('click', function (e) {
    var b = e.target.closest('[data-day]'); if (!b) return;
    state.day = b.dataset.day; save('fil-day', state.day); render();
  });
  view.addEventListener('click', function (e) {
    var b = e.target.closest('[data-id]'); if (b) toggle(b.dataset.id);
  });
  document.getElementById('picks').addEventListener('click', function (e) {
    var b = e.target.closest('[data-remove]'); if (b) toggle(b.dataset.remove);
  });
  document.getElementById('viewGrid').addEventListener('click', function () { state.view = 'grid'; save('fil-view', 'grid'); render(); });
  document.getElementById('viewList').addEventListener('click', function () { state.view = 'list'; save('fil-view', 'list'); render(); });
  document.getElementById('search').addEventListener('input', function (e) { state.q = e.target.value.trim().toLowerCase(); render(); });
  document.getElementById('onlyPicked').addEventListener('change', function (e) { state.only = e.target.checked; render(); });
  function goPlan() { location.href = 'itinerary.html?day=' + encodeURIComponent(state.day); }
  document.getElementById('planBtn').addEventListener('click', goPlan);
  document.getElementById('dockPlan').addEventListener('click', goPlan);
  document.getElementById('dockInfo').addEventListener('click', function () {
    document.querySelector('.panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.getElementById('clearDay').addEventListener('click', function () {
    dayPicks(state.day).forEach(function (p) { picks.delete(p.id); });
    commit();
  });

  render();
  // The brand font can arrive after the first draw and is a little wider than the fallback: fit again.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (state.view === 'grid') fitSets(); });
});
</script>
</body>
</html>
