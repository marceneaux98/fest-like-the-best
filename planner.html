<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage Map · Fest like the Best</title>
<meta name="description" content="Pick the sets you want at Festival International de Louisiane, get a walking plan between stages, and print your schedule. A preview built with the 2026 lineup: try it and tell us what you think.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fest like the Best">
<meta property="og:title" content="Stage Map · Fest like the Best">
<meta property="og:description" content="Pick the sets you want at Festival International de Louisiane, get a walking plan between stages, and print your schedule. A preview built with the 2026 lineup: try it and tell us what you think.">
<meta property="og:url" content="https://marceneaux98.github.io/fest-like-the-best/planner.html">
<meta property="og:image" content="https://marceneaux98.github.io/fest-like-the-best/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Fest like the Best: the festival site map with walking routes between stages">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* Colours, fonts and base styles come from brand.css */
  html, body { height: 100%; }
  body {
    display: grid;
    grid-template-columns: 360px 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    height: 100vh;
  }
  aside { min-height: 0; }
  aside {
    background: var(--card);
    border-right: 1px solid var(--line);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  h1 { margin: 0; font-size: 1.25rem; color: var(--purple); letter-spacing: .01em; }
  h1 span { color: var(--blue); }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }
  label { display: block; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  select {
    width: 100%; padding: 10px 12px; font-size: 1rem; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink);
  }
  .pickers { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
  .pickers .stack { display: flex; flex-direction: column; gap: 12px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #swap {
    height: 42px; width: 42px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
    cursor: pointer; font-size: 1.1rem; color: var(--purple); margin-bottom: 0;
  }
  #swap:hover { background: var(--bg); }
  .result {
    border-radius: 12px; padding: 16px; background: linear-gradient(135deg, var(--blue), var(--purple));
    color: #fff; min-height: 110px;
  }
  .result .time { font-size: 2.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .result .time small { font-size: 1rem; font-weight: 500; opacity: .9; }
  .result .meta { margin-top: 8px; font-size: .9rem; opacity: .92; }
  .result.empty { background: var(--bg); color: var(--muted); border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; text-align: center; font-size: .9rem; }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row input { flex: 1; accent-color: var(--orange); }
  #crowdVal { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3.2em; text-align: right; }
  .hint { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: .78rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 4px; text-align: center; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  th.row { text-align: left; white-space: nowrap; }
  td.self { color: #c9c6d3; }
  td.cell { cursor: pointer; border-radius: 4px; }
  td.cell:hover { background: var(--bg); }
  td.active { background: var(--orange); color: #fff; font-weight: 700; }
  label.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink); text-transform: none; letter-spacing: 0; font-size: .9rem; margin-bottom: 8px; }
  label.toggle input { accent-color: var(--purple); width: 16px; height: 16px; }
  .foot { margin-top: auto; font-size: .72rem; color: var(--muted); line-height: 1.5; }
  #map { height: 100%; width: 100%; }
  /* Tap targets on the stages. The poster already names every stage, so these are plain dots. */
  .pin {
    display: block; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; background: var(--purple);
    border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transform: translate(-50%, -50%); cursor: pointer;
  }
  .pin::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; } /* bigger area for fingers */
  .pin.from, .pin.to { width: 26px; height: 26px; }
  .pin.from { background: var(--blue); }
  .pin.to { background: var(--orange); }
  .leaflet-div-icon { background: none; border: none; }
  .merch-pin {
    display: inline-block; transform: translate(-50%, 80%); background: var(--orange); color: #fff; border: 2px solid #fff;
    border-radius: 999px; padding: 1px 7px; font: 700 10px system-ui, sans-serif; letter-spacing: .06em;
    box-shadow: 0 2px 5px rgba(0,0,0,.25); white-space: nowrap; pointer-events: none;
  }
  @media (max-width: 760px) {
    /* Phone: logo bar, then the map, then the controls */
    body { grid-template-columns: 1fr; grid-template-rows: auto 45vh auto; height: auto; }
    aside { border-right: none; padding: 16px; order: 3; }
    #map { height: 45vh; order: 2; }
    .foot { display: none; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Saira+Condensed:wght@500;700;800&family=Yellowtail&display=swap">
<link rel="stylesheet" href="brand.css">
<link rel="icon" href="assets/swirl.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#542e91">
<meta name="apple-mobile-web-app-title" content="Fest Best">
<meta name="i18n-title" content="pl_doc_title">
</head>
<body>
<div class="brand-bar" data-page="planner"></div>
<aside>
  <div>
    <h1 data-i18n-html="pl_title_html">Stage <span>Map</span></h1>
    <p class="sub" data-i18n="pl_sub">Walking time between any two stages. Pick two, or tap pins on the map.</p>
  </div>

  <div class="pickers">
    <div class="stack">
      <div><label for="from"><span class="dot" style="background:var(--blue)"></span><span data-i18n="pl_from">From</span></label><select id="from"></select></div>
      <div><label for="to"><span class="dot" style="background:var(--orange)"></span><span data-i18n="pl_to">To</span></label><select id="to"></select></div>
    </div>
    <button id="swap" type="button" title="Swap" data-i18n-title="pl_swap" data-i18n-aria="pl_swap">&#8645;</button>
  </div>

  <div id="result" class="result empty"></div>

  <div>
    <label for="crowd" data-i18n="crowd_factor">Crowd factor</label>
    <div class="slider-row">
      <input id="crowd" type="range" min="1" max="2.5" step="0.05">
      <span id="crowdVal"></span>
    </div>
    <div class="hint" data-i18n="pl_crowd_hint">1.0× = normal walking pace (~5 km/h). Raise it for festival crowds.</div>
  </div>

  <div id="overlayBox">
    <label data-i18n="map_layers">Show on the festival map</label>
    <div id="mapLayers" role="group" data-i18n-aria="map_layers" aria-label="Show on the festival map"></div>
    <div class="hint" id="overlayStatus" data-i18n="overlay_note">The illustrated map is approximate and not to scale.</div>
  </div>

  <div>
    <label data-i18n="pl_matrix">All walk times (min, with crowd factor)</label>
    <table id="matrix"></table>
  </div>

  <div class="foot" id="foot"></div>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="i18n.js"></script>
<script src="routes.js"></script>
<script src="overlay.js"></script>
<script src="site-overlay.js"></script>
<script src="common.js"></script>
<script>
FIL.ready(function () {
  var D = window.ROUTE_DATA;
  if (!D) { document.getElementById('result').textContent = 'routes.js not found — run: python build_routes.py'; return; }

  var esc = FIL.esc;
  var locs = FIL.stages, byId = FIL.stageById;
  var fromSel = document.getElementById('from'), toSel = document.getElementById('to');
  var crowd = document.getElementById('crowd'), crowdVal = document.getElementById('crowdVal');
  var resultEl = document.getElementById('result');

  function getRoute(a, b) { return FIL.walk(a, b); }  // measured along the route drawn on the map (common.js)
  var T = I18N.t;
  function mins(sec) { return sec * parseFloat(crowd.value) / 60; }
  var nf1 = new Intl.NumberFormat(I18N.locale, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var nf2 = new Intl.NumberFormat(I18N.locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function fmtMin(m) { return m < 10 ? nf1.format(m) : Math.round(m).toString(); }

  // Pickers
  [fromSel, toSel].forEach(function (sel) {
    sel.add(new Option('—', ''));
    locs.forEach(function (l) { sel.add(new Option(l.name, l.id)); });
  });

  // Crowd factor (remembered per browser)
  var saved = null;
  try { saved = localStorage.getItem('crowdFactor'); } catch (e) {}
  crowd.value = saved || D.crowd_factor_default || 1;

  // Map: the festival's own illustrated map, upright (see site-overlay.js)
  var sm = SiteMap.create('map', { layersBox: document.getElementById('mapLayers'), status: document.getElementById('overlayStatus') });
  var map = sm.map;

  var markers = {};
  locs.forEach(function (l) {
    var m = L.marker(sm.pt(l.id), { icon: L.divIcon({ className: '', html: '<span class="pin" data-id="' + l.id + '" title="' + esc(l.name) + '"></span>', iconSize: null }),
      title: l.name, alt: l.name, keyboard: true }).addTo(map);
    m.on('click', function () { pick(l.id); });
    markers[l.id] = m;
  });

  // Shops: placed on the map in the route editor; older route files only have merch booths at their stages.
  if (sm.shops()) sm.shops().forEach(function (s) {
    L.marker(sm.pt(s.id), { icon: L.divIcon({ className: '', html: '<span class="shop-pin ' + esc(s.kind) + '" title="' + esc(T('shop_kind_' + s.kind)) + '">' + esc(T('shop_tag_' + s.kind)) + '</span>', iconSize: null }),
      interactive: false, zIndexOffset: 1500 }).addTo(map);
  });
  else (D.merch_booths || []).forEach(function (b) {
    var l = byId[b.at]; if (!l) return;
    L.marker(sm.pt(l.id), { icon: L.divIcon({ className: '', html: '<span class="merch-pin" title="' + esc(b.name) + '">' + esc(T('shop_tag_merch')) + '</span>', iconSize: null }),
      interactive: false, zIndexOffset: 1500 }).addTo(map);
  });

  var routeGroup = L.layerGroup().addTo(map);

  // Tapping pins: first sets From, second sets To, third starts over.
  function pick(id) {
    if (!fromSel.value || (fromSel.value && toSel.value)) { fromSel.value = id; toSel.value = ''; }
    else if (id !== fromSel.value) { toSel.value = id; }
    update();
  }

  function update() {
    var a = fromSel.value, b = toSel.value;
    crowdVal.textContent = nf2.format(parseFloat(crowd.value)) + '×';

    Object.keys(markers).forEach(function (id) {
      var el = markers[id].getElement(); if (!el) return;
      var pin = el.querySelector('.pin');
      pin.className = 'pin' + (id === a ? ' from' : id === b ? ' to' : '');
      markers[id].setZIndexOffset(id === a || id === b ? 1000 : 0);
    });

    routeGroup.clearLayers();

    var r = (a && b && a !== b) ? getRoute(a, b) : null;
    if (!r) {
      resultEl.className = 'result empty';
      resultEl.textContent = T((a && b && a === b) ? 'pl_pick_diff' : 'pl_choose');
    } else {
      var m = mins(r.seconds), base = r.seconds / 60;
      resultEl.className = 'result';
      resultEl.innerHTML = '<div class="time">' + fmtMin(m) + ' <small>' + esc(T('pl_min_walk')) + '</small></div>' +
        '<div class="meta">' + esc(byId[a].name) + ' → ' + esc(byId[b].name) + '<br>' +
        esc(T('pl_meta', { m: r.meters, ft: new Intl.NumberFormat(I18N.locale, { maximumFractionDigits: 0 }).format(Math.round(r.meters * 3.28084 / 10) * 10), mi: nf2.format(r.meters * 0.000621371), n: fmtMin(base) })) + '</div>';
      // Tip and time-of-day alternates (set in the route editor)
      var tip = sm.tip(a, b), alts = sm.alternates(a, b);
      if (tip) resultEl.innerHTML += '<div class="meta">' + esc(T('it_tip', { tip: tip })) + '</div>';
      if (alts.length) resultEl.innerHTML += '<div class="meta"><b>' + esc(T('pl_alts')) + '</b><br>' + alts.map(function (x) {
        var sec = x.metres ? r.seconds * x.metres / r.meters : r.seconds;
        return esc(T('pl_alt_line', { label: x.label, when: SiteMap.whenText(x), n: fmtMin(mins(sec)) })) + (x.tip ? '<br><i>' + esc(x.tip) + '</i>' : '');
      }).join('<br>') + '</div>';
      alts.forEach(function (x) { sm.draw(sm.shape(a, b, x.points), routeGroup, { color: '#f26631', weight: 4, opacity: .9, dash: '6 6', casing: false }); });
      var shape = sm.shape(a, b);
      sm.draw(shape, routeGroup, { color: '#542e91', weight: 5 });
      map.fitBounds(L.latLngBounds(shape.all), { padding: [60, 60], maxZoom: 1 });
    }
    drawMatrix(a, b);
  }

  function drawMatrix(a, b) {
    var t = document.getElementById('matrix');
    var short = function (n) { return n.split(' ')[0].slice(0, 6); };
    var h = '<tr><th></th>' + locs.map(function (l) { return '<th title="' + l.name + '">' + short(l.name) + '</th>'; }).join('') + '</tr>';
    locs.forEach(function (r) {
      h += '<tr><th class="row">' + r.name + '</th>';
      locs.forEach(function (c) {
        if (r.id === c.id) { h += '<td class="self">·</td>'; return; }
        var rt = getRoute(r.id, c.id);
        var on = (r.id === a && c.id === b) || (r.id === b && c.id === a);
        h += '<td class="cell' + (on ? ' active' : '') + '" data-a="' + r.id + '" data-b="' + c.id + '">' + (rt ? fmtMin(mins(rt.seconds)) : '?') + '</td>';
      });
      h += '</tr>';
    });
    t.innerHTML = h;
  }

  document.getElementById('matrix').addEventListener('click', function (e) {
    var td = e.target.closest('td.cell'); if (!td) return;
    fromSel.value = td.dataset.a; toSel.value = td.dataset.b; update();
  });
  document.getElementById('swap').addEventListener('click', function () {
    var t = fromSel.value; fromSel.value = toSel.value; toSel.value = t; update();
  });
  fromSel.addEventListener('change', update);
  toSel.addEventListener('change', update);
  crowd.addEventListener('input', function () {
    try { localStorage.setItem('crowdFactor', crowd.value); } catch (e) {}
    update();
  });

  document.getElementById('foot').innerHTML = esc(T('pl_foot', { date: D.built })) + '<br>' +
    'To change locations: edit <code>locations.json</code>, then run <code>python build_routes.py</code>.';

  update();
});
</script>
</body>
</html>
